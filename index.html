<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西安话字音查询 · xinganhua-ziyencaxin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%279%27 fill=%27%239F363A%27/%3E%3Ctext x=%2732%27 y=%2747%27 font-size=%2742%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27serif%27%3E%E7%A7%A6%3C/text%3E%3C/svg%3E">
<meta name="description" content="输入汉字，查西安话（关中片）的字音：西安话拼音、国际音标、声调与词典释注。支持简体、繁体，一次最多 30 字。">
<style>
@font-face{
  font-family:"LXGW WenKai";
  font-style:normal;font-weight:400;font-display:swap;
  src:local("LXGW WenKai"),local("霞鹜文楷"),url("fonts/lxgw-wenkai.woff2?v=5") format("woff2");
}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#000000;
  --paper:#ffffff;
  --crimson:#9F363A;
  --bg:#F4EEE9;
  --bg-card:#FBF7F4;
  --bg-deep:#F1E7E2;
  --line:#E7D9D2;
  --line-soft:#F0E6E1;
  --text:#1C1512;
  --muted:rgba(28,21,18,.62);
  --faint:rgba(28,21,18,.45);
  --serif:"LXGW WenKai","SimSun-ExtB","MingLiU-ExtB","I.Ming","HanaMinB","BabelStone Han","Songti SC","Noto Serif CJK SC",Georgia,"SimSun",serif;
}
html,body{height:100%}
body{
  min-height:100vh;display:flex;flex-direction:column;
  font-family:var(--serif);color:var(--text);background:var(--bg);
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ───────── 语言切换 ───────── */
.lang-switcher{
  position:absolute;top:14px;right:16px;z-index:5;
  display:flex;gap:2px;padding:2px;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 1px 3px rgba(28,21,18,.05);
}
.lang-switcher button{
  font-family:var(--serif);font-size:.8em;line-height:1;
  padding:6px 10px;border:0;border-radius:999px;background:#F1E7E2;color:#7E2A2E;
  cursor:pointer;letter-spacing:.04em;transition:background .15s,color .15s;
}
.lang-switcher button:hover{background:#FBF3F1;color:var(--crimson)}
.lang-switcher button[aria-pressed="true"]{background:#77282C;color:var(--paper)}
.lang-switcher button[aria-pressed="true"]:hover{background:#8C3236;color:var(--paper)}

/* ───────── 页头 ───────── */
.site-header{position:relative;padding:38px 20px 0;text-align:center}
.brand{display:inline-flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap}
.seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;flex-shrink:0;
  background:var(--crimson);color:var(--paper);border-radius:6px;
  font-size:24px;font-weight:700;letter-spacing:0;
  box-shadow:0 3px 10px rgba(159,54,58,.28);
}
h1{font-size:2.05em;font-weight:700;letter-spacing:.1em;line-height:1.25;color:var(--ink)}
h1 .accent{color:var(--crimson)}
.subtitle{margin-top:12px;font-size:.95em;line-height:1.75;color:var(--muted);letter-spacing:.02em}
.subtitle b{font-weight:400;color:var(--ink);border-bottom:2px solid rgba(159,54,58,.4);padding-bottom:1px}

.search-box{display:flex;gap:10px;justify-content:center;align-items:stretch;margin:24px auto 0;max-width:640px;min-width:0}
#charInput{
  flex:1 1 auto;max-width:100%;min-width:0;
  padding:13px 18px;font-family:var(--serif);font-size:1.22em;color:var(--text);
  background:var(--paper);border:2px solid var(--line);border-radius:10px;outline:none;
  box-shadow:0 1px 2px rgba(28,21,18,.03);
  transition:border-color .15s,box-shadow .15s;
}
#charInput::placeholder{color:rgba(28,21,18,.34);font-size:.84em;letter-spacing:.02em}
#charInput:focus{border-color:var(--crimson);box-shadow:0 0 0 4px rgba(159,54,58,.13)}
#searchBtn{
  padding:13px 28px;font-family:var(--serif);font-size:1.05em;letter-spacing:.16em;
  color:var(--paper);background:#77282C;border:2px solid #77282C;
  border-radius:10px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 10px rgba(119,40,44,.26);
  transition:background .15s,border-color .15s,box-shadow .15s;
}
#searchBtn:hover{background:var(--crimson);border-color:var(--crimson)}
#searchBtn:active{background:#B04B4F;border-color:#B04B4F}
#searchBtn:focus-visible{outline:3px solid rgba(159,54,58,.35);outline-offset:2px}
#searchBtn:disabled{opacity:.55;cursor:progress}

.meta-row{
  display:flex;flex-wrap:wrap;gap:6px 0;justify-content:center;align-items:center;
  margin-top:14px;font-size:.84em;color:var(--faint);letter-spacing:.03em;
}
.meta-row .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:rgba(159,54,58,.55);margin:0 12px;vertical-align:middle}

.legend{
  display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;
  max-width:760px;margin:20px auto 0;padding:11px 16px;
  background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
  font-size:.85em;letter-spacing:.02em;color:var(--muted);
}
.legend b{color:var(--crimson);font-weight:700}
.legend .ex{color:var(--faint)}
.legend .ex b{color:var(--ink);font-weight:400}

/* ───────── 结果区 ───────── */
main{flex:1 0 auto}
.container{max-width:900px;margin:0 auto;padding:26px 20px 46px}

.error-msg{
  margin:2px 0 18px;padding:12px 16px;text-align:center;font-size:.95em;
  color:var(--crimson);background:#FBF1F0;
  border:1px solid rgba(159,54,58,.32);border-radius:10px;
}
.no-result{margin:22px 0;text-align:center;color:var(--muted);font-size:.95em}
.results{margin-top:2px}

.card{
  background:var(--bg-card);
  border:1px solid var(--line);border-left:4px solid var(--crimson);
  border-radius:12px;padding:18px 20px;margin-bottom:16px;
  box-shadow:0 2px 10px rgba(28,21,18,.045);
}
.card-head{display:flex;align-items:flex-start;gap:20px}
.glyph{flex:0 0 auto;text-align:center;min-width:100px}
.glyph .main{font-size:3.2em;line-height:1.15;font-weight:400;color:var(--ink)}
.glyph .alt{margin-top:5px;font-size:.85em;letter-spacing:.08em;color:var(--faint)}
.glyph .count{margin-top:3px;font-size:.73em;letter-spacing:.08em;color:rgba(28,21,18,.38)}
.glyph .tag{
  display:inline-block;margin-top:8px;padding:1px 9px;font-size:.72em;letter-spacing:.06em;
  color:var(--crimson);border:1px solid rgba(159,54,58,.34);border-radius:999px;background:#F7ECEA;
}
.readings{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line-soft);padding-left:18px}
.reading{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:9px;
  padding:10px 14px 11px;
}
.read-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.py{font-size:1.36em;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.py .tn{color:var(--crimson)}
.ipa{font-size:1.04em;color:rgba(28,21,18,.74)}
.ipa .tone{font-size:.8em;vertical-align:super;color:var(--crimson);letter-spacing:0}
.tone-tag{
  font-size:.74em;letter-spacing:.08em;color:var(--crimson);
  padding:1px 9px;border:1px solid rgba(159,54,58,.26);border-radius:999px;background:rgba(159,54,58,.06);
}
.note{
  margin-top:7px;padding:6px 10px;font-size:.86em;line-height:1.65;color:var(--muted);
  background:#F8F0ED;border-left:2px solid rgba(159,54,58,.42);border-radius:0 6px 6px 0;
}
.note .lbl{color:var(--crimson);margin-right:5px}

.missing{border-left-color:rgba(28,21,18,.24)}
.missing .glyph .main{color:var(--faint)}
.missing-tip{color:var(--muted);font-size:.95em;padding:6px 0}

/* 引导 */
.empty{margin:20px auto 0;max-width:680px;text-align:center}
.empty .lead{font-size:1em;letter-spacing:.04em;color:var(--muted)}
.empty .lead b{color:var(--ink);font-weight:400;border-bottom:2px solid rgba(159,54,58,.45);padding-bottom:1px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
.chip{
  font-family:var(--serif);font-size:1em;letter-spacing:.04em;
  padding:7px 16px;background:#77282C;color:var(--paper);
  border:1px solid #77282C;border-radius:999px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s,transform .1s;
}
.chip:hover{background:var(--crimson);border-color:var(--crimson);color:var(--paper)}
.chip:active{transform:translateY(1px);background:#B04B4F;border-color:#B04B4F}
#results:not(:empty) ~ .empty{display:none}

/* 音系入口 */
.scheme-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:26px;padding:15px 18px;text-align:left;
  background:var(--bg-card);border:1px solid var(--line);border-left:4px solid var(--crimson);
  border-radius:12px;cursor:pointer;box-shadow:0 2px 10px rgba(28,21,18,.04);
  transition:background .15s,border-color .15s;
}
.scheme-bar:hover{background:#FFFDFC;border-color:#F0E3DC}
.scheme-bar:focus-visible{outline:3px solid rgba(159,54,58,.28);outline-offset:2px}
.scheme-title{font-size:1em;letter-spacing:.05em;color:var(--ink)}
.scheme-desc{margin-top:4px;font-size:.82em;color:var(--muted);letter-spacing:.02em}
.scheme-more{color:var(--crimson);font-size:.88em;white-space:nowrap;letter-spacing:.04em}

/* ───────── 页脚（墨） ───────── */
footer{
  flex-shrink:0;background:var(--ink);color:rgba(255,255,255,.88);
  padding:19px 20px 21px;text-align:center;font-size:.84em;line-height:1.95;
}
footer a{color:var(--paper);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45)}
footer a:hover{border-bottom-color:var(--paper)}
footer .sep{margin:0 9px;color:rgba(255,255,255,.38)}
footer .sig{letter-spacing:.1em;color:rgba(255,255,255,.66)}

/* ───────── 浮窗：音系与方案 ───────── */
.modal{position:fixed;inset:0;z-index:60;display:none}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(22,14,12,.46)}
.modal-panel{
  position:relative;max-width:880px;margin:5vh auto 0;
  background:var(--paper);border-radius:14px;overflow:hidden;
  max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.32);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 20px;border-bottom:1px solid var(--line);background:var(--bg-card);flex-shrink:0;
}
.modal-head h2{font-size:1.1em;letter-spacing:.06em;color:var(--ink)}
.modal-close{
  border:0;background:none;font-size:1.6em;line-height:1;color:var(--crimson);
  cursor:pointer;padding:0 4px;border-radius:6px;
}
.modal-close{background:#F7ECEA}
.modal-close:hover{background:#FDF7F5}
.modal-body{padding:6px 22px 28px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-body h3{
  display:flex;align-items:center;gap:9px;
  font-size:1.02em;letter-spacing:.06em;color:var(--crimson);
  margin:24px 0 10px;
}
.modal-body h3::before{content:"";width:3px;height:1em;background:var(--crimson);border-radius:2px}
.modal-body h4{font-size:.94em;letter-spacing:.03em;color:var(--ink);margin:18px 0 6px}
.modal-body p{font-size:.9em;line-height:1.9;color:var(--muted);margin:6px 0}
.modal-body code{font-family:inherit;background:var(--bg-deep);border-radius:4px;padding:0 4px;color:var(--text)}
.phon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;margin:10px 0 4px}
.phon-cell{
  background:var(--bg-card);border:1px solid var(--line);border-radius:8px;
  padding:7px 8px;text-align:center;line-height:1.45;
}
.phon-cell .s{font-size:1.02em;font-weight:700;color:var(--ink)}
.phon-cell .i{font-size:.72em;color:var(--muted)}
.phon-cell .e{font-size:.76em;color:var(--faint);margin-top:1px}
.fin-group{margin-top:12px}
.fin-label{font-size:.8em;letter-spacing:.08em;color:var(--crimson);margin-bottom:4px}
.modal-body table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:.86em}
.modal-body th,.modal-body td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.modal-body th{color:var(--muted);font-weight:400;background:var(--bg-card);border-bottom-color:var(--line)}
.modal-body td:nth-child(2){color:var(--crimson)}
.modal-body td:nth-child(3){color:var(--muted)}
.phon-note{font-size:.84em !important;background:var(--bg-card);border-left:2px solid rgba(159,54,58,.4);border-radius:0 6px 6px 0;padding:7px 11px}
.modal-link{margin-top:22px !important}
.modal-link a{color:var(--crimson);text-decoration:none;border-bottom:1px solid rgba(159,54,58,.4)}

@media (max-width:600px){
  .lang-switcher{top:10px;right:10px;padding:1px}
  .lang-switcher button{padding:5px 8px;font-size:.74em}
  .site-header{padding:32px 16px 0}
  .seal{width:36px;height:36px;font-size:20px}
  h1{font-size:1.58em;letter-spacing:.06em}
  .subtitle{font-size:.88em;line-height:1.7}
  .search-box{flex-direction:column;margin-top:18px}
  #charInput{width:100%}
  #searchBtn{width:100%;letter-spacing:.2em}
  .legend{gap:5px 12px;font-size:.8em;padding:9px 10px}
  .container{padding:18px 14px 34px}
  .card{padding:14px}
  .card-head{gap:12px}
  .glyph{min-width:72px}
  .glyph .main{font-size:2.55em}
  .readings{padding-left:12px;gap:7px}
  .reading{padding:9px 11px 10px}
  .py{font-size:1.2em}
  .ipa{font-size:.98em}
  .scheme-bar{padding:12px 14px}
  .scheme-desc{font-size:.76em}
  .modal-panel{margin:3vh 10px 0;max-height:93vh;border-radius:12px}
  .modal-head{padding:12px 14px}
  .modal-body{padding:4px 14px 22px}
  .phon-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
  footer{font-size:.78em}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="lang-switcher" id="langSwitcher" aria-label="语言">
    <button type="button" data-lang="hans">简</button>
    <button type="button" data-lang="hant">繁</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <div class="brand">
    <span class="seal" aria-hidden="true">秦</span>
    <h1 id="tTitle">西安话<span class="accent">字音</span>查询</h1>
  </div>
  <p class="subtitle" id="tSubtitle">输入汉字，查它在西安话（关中片）里的<b>拼音</b>与<b>国际音标</b>；有释注一并列出</p>

  <form class="search-box" id="searchForm" autocomplete="off">
    <input id="charInput" type="text" maxlength="120" spellcheck="false"
           placeholder="输入汉字，如：西安话 着 鵝" aria-label="输入汉字">
    <button id="searchBtn" type="submit">查字</button>
  </form>

  <div class="meta-row" id="tMeta"></div>
  <div class="legend" id="tLegend"></div>
</header>

<main>
  <div class="container">
    <div id="message"></div>
    <div class="results" id="results"></div>

    <div class="empty">
      <p class="lead" id="tLead">输入一个或多个汉字试试，比如 <b>西安话</b>、<b>着</b>、<b>鵝</b></p>
      <div class="chips">
        <button type="button" class="chip" data-q="西安话">西安话</button>
        <button type="button" class="chip" data-q="着">着</button>
        <button type="button" class="chip" data-q="鵝">鵝</button>
        <button type="button" class="chip" data-q="邊">邊</button>
        <button type="button" class="chip" data-q="𰻞">𰻞</button>
        <button type="button" class="chip" data-q="大">大</button>
      </div>
    </div>

    <div class="scheme-bar" id="schemeBar" role="button" tabindex="0">
      <div>
        <div class="scheme-title" id="tSchemeTitle">西安话音系与输入方案</div>
        <div class="scheme-desc" id="tSchemeDesc">声母 26 · 韵母 40 · 四声；点开看与普通话拼音的异同</div>
      </div>
      <span class="scheme-more" id="tSchemeMore">查看 →</span>
    </div>
  </div>
</main>

<footer>
  <div id="tFooter">字音取自 <a href="https://github.com/osfans/MCPDict" target="_blank" rel="noopener">MCPDict《西安》数据表</a><span class="sep">|</span>拼音方案 <a href="https://github.com/SiqYin/xinganhua-fuvufa" target="_blank" rel="noopener">西安话拼音</a><span class="sep">|</span>字体 <a href="https://github.com/lxgw/LxgwWenKai" target="_blank" rel="noopener">霞鹜文楷</a>（OFL）</div>
  <div class="sig" id="tSig">玄为秦，绛为汉<span class="sep">|</span>xinganhua-ziyencaxin<span class="sep">|</span>v0.7</div>
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="tModalTitle">
    <div class="modal-head">
      <h2 id="tModalTitle">西安话音系与输入方案</h2>
      <button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var MAX_CHARS = 30;
  var LANGS = ['hans', 'hant', 'en'];
  var KEY = 'xianhua-lang';
  var EN_REGIONS = ['US', 'GB', 'CA', 'AU', 'NZ', 'FR', 'DE', 'KR'];
  var HANT_REGIONS = ['HK', 'MO', 'TW'];

  var form = document.getElementById('searchForm');
  var input = document.getElementById('charInput');
  var btn = document.getElementById('searchBtn');
  var results = document.getElementById('results');
  var message = document.getElementById('message');
  var modal = document.getElementById('modal');
  var modalBody = document.getElementById('modalBody');
  var modalTitle = document.getElementById('tModalTitle');
  var modalClose = document.getElementById('modalClose');

  var byChar = new Map();
  var variants = { s2t: {}, t2s: {} };
  var I18N = null;
  var LANG = 'hans';
  var LAST = { text: '', has: false };
  var ready = false;

  var TONE_HANT = { '阴平': '陰平', '阳平': '陽平', '上声': '上聲', '去声': '去聲' };
  var TONE_EN = { '阴平': 'Yinping', '阳平': 'Yangping', '上声': 'Shangsheng', '去声': 'Qusheng' };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function pack() { return (I18N && I18N.langs[LANG]) || (I18N && I18N.langs.hans) || {}; }

  function t(key, vars) {
    var v = pack()[key];
    if (v == null || typeof v !== 'string') return '';
    return vars ? v.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }) : v;
  }

  function toneName(n) {
    if (LANG === 'en') return TONE_EN[n] || n;
    if (LANG === 'hant') return TONE_HANT[n] || n;
    return n;
  }

  /* ───────── 数据 ───────── */
  function loadData() {
    return Promise.all([
      fetch('data/xian.json?v=5').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/variants.json?v=5').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/i18n.json?v=5').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    ]).then(function (out) {
      out[0].forEach(function (rec) { byChar.set(rec.character, rec); });
      variants = out[1];
      I18N = out[2];
    });
  }

  /* ───────── 语言 ───────── */
  function applyLang(lang, persist) {
    if (LANGS.indexOf(lang) < 0) lang = 'hans';
    LANG = lang;
    document.documentElement.lang = lang === 'en' ? 'en' : (lang === 'hant' ? 'zh-Hant' : 'zh-Hans');
    if (I18N) {
      var d = pack();
      document.title = d.docTitle || document.title;
      var h = d.h1 || ['', '', ''];
      var gap = LANG === 'en' ? ' ' : '';
      document.getElementById('tTitle').innerHTML = esc(h[0]) + gap + '<span class="accent">' + esc(h[1]) + '</span>' + gap + esc(h[2]);
      document.getElementById('tSubtitle').innerHTML = d.subtitle || '';
      input.setAttribute('placeholder', d.placeholder || '');
      btn.textContent = d.search || '';
      document.getElementById('tMeta').innerHTML = (d.meta || []).map(esc).join('<span class="dot"></span>');
      document.getElementById('tLegend').innerHTML = (d.legend || []).join('')
        + (d.legendEx ? '<span class="ex">' + d.legendEx + '</span>' : '');
      document.getElementById('tLead').innerHTML = d.lead || '';
      document.getElementById('tSchemeTitle').textContent = d.schemeTitle || '';
      document.getElementById('tSchemeDesc').textContent = d.schemeDesc || '';
      document.getElementById('tSchemeMore').textContent = d.schemeMore || '';
      document.getElementById('tFooter').innerHTML = d.footerLine || '';
      document.getElementById('tSig').innerHTML = esc(d.sig || '')
        + '<span class="sep">|</span>xinganhua-ziyencaxin<span class="sep">|</span>v0.7';
      modalTitle.textContent = d.modalTitle || '';
      modalClose.setAttribute('aria-label', d.modalClose || 'Close');
      if (modal.classList.contains('open')) buildModal();
    }
    var sw = document.getElementById('langSwitcher').querySelectorAll('button');
    for (var i = 0; i < sw.length; i++) {
      sw[i].setAttribute('aria-pressed', sw[i].getAttribute('data-lang') === lang ? 'true' : 'false');
    }
    if (persist) { try { localStorage.setItem(KEY, lang); } catch (e) {} }
    if (LAST.has) doSearch(LAST.text, false);
  }

  // 只有中文变体才由系统语言决定；英文等其它系统语言交给 IP 判断
  // （否则「英文系统 + 日本 IP」会被系统语言误判成英文）
  function sysLang() {
    var ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < ls.length; i++) {
      var l = String(ls[i] || '').toLowerCase();
      if (/^zh(-|$)/.test(l)) return /hant|tw|hk|mo/.test(l) ? 'hant' : 'hans';
    }
    return null;
  }

  // ?lang=debug 时在页面顶部显示判定过程；平时的判定结果只写 console
  function langDiag(info) {
    try { if (window.console) console.info('[xianhua-lang]', info); } catch (e) {}
    if (!/[?&]lang=debug/i.test(location.search)) return;
    var box = document.getElementById('langDiag');
    if (!box) {
      box = document.createElement('div');
      box.id = 'langDiag';
      box.style.cssText = 'margin:10px auto 0;max-width:900px;padding:8px 12px;background:#FBF1F0;'
        + 'border:1px solid rgba(159,54,58,.32);border-radius:8px;font-size:12px;color:#9F363A;text-align:center;line-height:1.7';
      var host = document.querySelector('main .container');
      if (host) host.insertBefore(box, host.firstChild);
      else document.body.appendChild(box);
    }
    var parts = [];
    for (var k in info) parts.push(k + '=' + info[k]);
    box.textContent = '语言判定：' + parts.join(' · ');
  }

  function regionLang(code) {
    var c = String(code || '').toUpperCase();
    if (HANT_REGIONS.indexOf(c) >= 0) return 'hant';
    if (EN_REGIONS.indexOf(c) >= 0) return 'en';
    return 'hans';
  }

  function ipLang(cb) {
    var done = false;
    function fin(c) { if (done) return; done = true; cb(c); }
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'https://api.country.is/', true);
      x.timeout = 1500;
      x.onload = function () {
        try { var j = JSON.parse(x.responseText); fin(j && j.country); } catch (e) { fin(null); }
      };
      x.onerror = x.ontimeout = function () {
        try {
          var y = new XMLHttpRequest();
          y.open('GET', 'https://www.cloudflare.com/cdn-cgi/trace', true);
          y.timeout = 1500;
          y.onload = function () {
            var m = /(?:^|\n)loc=([A-Za-z]{2})/.exec(y.responseText || '');
            fin(m ? m[1] : null);
          };
          y.onerror = y.ontimeout = function () { fin(null); };
          y.send();
        } catch (e2) { fin(null); }
      };
      x.send();
    } catch (e) { fin(null); }
  }

  function initLang() {
    var forced = null;
    try {
      var q = /[?&]lang=(hans|hant|en|auto)/i.exec(location.search);
      if (q) {
        if (q[1].toLowerCase() === 'auto') { try { localStorage.removeItem(KEY); } catch (e) {} }
        else forced = q[1].toLowerCase();
      }
    } catch (e) {}
    if (forced) { applyLang(forced, false); langDiag({ reason: 'url', lang: forced }); return; }

    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved && LANGS.indexOf(saved) >= 0) {
      applyLang(saved, false);
      langDiag({ reason: 'manual', lang: saved, hint: '点右上角可改，或访问 ?lang=auto 清除手选' });
      return;
    }

    var sys = sysLang();
    if (sys) {
      applyLang(sys, false);
      langDiag({ reason: 'system', lang: sys, languages: (navigator.languages || [navigator.language || '']).join(',') });
      return;
    }

    var host = location.hostname;
    var online = location.protocol !== 'file:' && host && host !== 'localhost' && host !== '127.0.0.1' && host !== '::1';
    var isBot = /bot|crawler|spider|slurp|yandex|baiduspider|googlebot|bingbot/i.test(navigator.userAgent || '');
    if (online && !isBot) {
      ipLang(function (country) {
        var lang = country ? regionLang(country) : 'hans';
        applyLang(lang, false);
        langDiag({ reason: 'ip', country: country || '-', lang: lang, languages: (navigator.languages || [navigator.language || '']).join(',') });
      });
    } else {
      applyLang('hans', false);
      langDiag({ reason: 'offline', lang: 'hans' });
    }
  }

  /* ───────── 渲染结果 ───────── */
  function expand(ch) {
    var out = [];
    var targets = (variants.s2t && variants.s2t[ch]) || null;
    if (targets && targets.length) {
      targets.forEach(function (x) { out.push({ character: x, from: ch }); });
      if (out.every(function (o) { return o.character !== ch; }) && byChar.has(ch)) {
        out.push({ character: ch, from: ch });
      }
    } else {
      out.push({ character: ch, from: ch });
    }
    return out;
  }

  function altForm(ch) {
    var s = variants.t2s && variants.t2s[ch];
    return s && s !== ch ? s : '';
  }

  function localNote(note) {
    if (LANG === 'hans') return note.replace(/白讀/g, '白读').replace(/文讀/g, '文读');
    return note;
  }

  function renderReading(r) {
    var html = '<div class="reading"><div class="read-line">';
    html += '<span class="py">' + esc(r.py.slice(0, -1)) + '<span class="tn">' + esc(r.py.slice(-1)) + '</span></span>';
    html += '<span class="ipa">[' + esc(r.ipa) + '<span class="tone">' + esc(r.val_sup) + '</span>]</span>';
    html += '<span class="tone-tag">' + esc(toneName(r.tone)) + ' ' + esc(r.val) + '</span>';
    html += '</div>';
    if (r.note) {
      html += '<div class="note"><span class="lbl">' + esc(t('noteLabel')) + '</span>' + esc(localNote(r.note)) + '</div>';
    }
    return html + '</div>';
  }

  function renderCard(rec, from) {
    var alt = altForm(rec.character);
    var html = '<section class="card"><div class="card-head">';
    html += '<div class="glyph"><div class="main">' + esc(rec.character) + '</div>';
    if (alt) html += '<div class="alt">' + esc(t('alt', { c: alt })) + '</div>';
    html += '<div class="count">' + esc(t(rec.readings.length === 1 ? 'countOne' : 'count', { n: rec.readings.length })) + '</div>';
    if (from && from !== rec.character && from !== alt) {
      html += '<div class="tag">' + esc(t('from', { c: from })) + '</div>';
    }
    html += '</div><div class="readings">';
    rec.readings.forEach(function (r) { html += renderReading(r); });
    return html + '</div></div></section>';
  }

  function renderMissing(ch, from) {
    var via = from && from !== ch;
    var html = '<section class="card missing"><div class="card-head">';
    html += '<div class="glyph"><div class="main">' + esc(ch) + '</div>';
    if (via) html += '<div class="tag">' + esc(t('from', { c: from })) + '</div>';
    html += '</div><div class="readings"><div class="missing-tip">'
      + esc(via ? t('missingAlt') : t('missing')) + '</div></div></div></section>';
    return html;
  }

  function setMessage(text, isError) {
    message.innerHTML = text ? '<div class="' + (isError ? 'error-msg' : 'no-result') + '">' + esc(text) + '</div>' : '';
  }

  function doSearch(text, pushState) {
    if (!ready) { setMessage(t('msgLoading')); return; }
    LAST.text = text; LAST.has = true;
    var raw = Array.from(String(text || '').replace(/\s+/g, ''));  // Array.from 按码位切，扩展 B~H 区的字（如 U+30EDE 𰻞）不会被拆成两个代理项
    var CJK = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\u{20000}-\u{2FA1F}\u{30000}-\u{323AF}]/u;
    var chars = raw.filter(function (c) { return CJK.test(c); });
    if (!raw.length) { results.innerHTML = ''; setMessage(t('msgEmpty')); input.focus(); return; }
    if (!chars.length) { results.innerHTML = ''; setMessage(t('msgNotChinese')); return; }
    if (chars.length > MAX_CHARS) {
      results.innerHTML = '';
      setMessage(t('msgTooMany', { max: MAX_CHARS, n: chars.length }));
      return;
    }
    var seen = new Set(), order = [], items = [];
    chars.forEach(function (ch) {
      if (seen.has(ch)) return;
      seen.add(ch);
      order.push(ch);
      expand(ch).forEach(function (hit) {
        if (items.some(function (i) { return i.character === hit.character; })) return;
        items.push(hit);
      });
    });

    var html = '', found = 0;
    items.forEach(function (item) {
      var rec = byChar.get(item.character);
      if (rec) { found++; html += renderCard(rec, item.from); }
      else html += renderMissing(item.character, item.from);
    });
    results.innerHTML = html;
    setMessage(found === 0 ? t('msgNoResult', { chars: order.join('') }) : '');
    if (pushState && window.history && history.replaceState) {
      var url = location.pathname + (order.length ? '?q=' + encodeURIComponent(order.join('')) : '');
      history.replaceState(null, '', url);
    }
  }

  /* ───────── 音系浮窗 ───────── */
  function phonCell(item) {
    return '<div class="phon-cell"><div class="s">' + esc(item[0]) + '</div>'
      + '<div class="i">' + esc(item[1]) + '</div>'
      + '<div class="e">' + esc(item[2] + ' ' + item[3]) + '</div></div>';
  }

  function buildModal() {
    var d = pack(), T = I18N.tables;
    var h = '<p>' + (d.phon.intro || '') + '</p>';

    h += '<h3>' + esc(d.phon.initialsTitle) + '</h3><div class="phon-grid">'
      + T.initials.map(phonCell).join('') + '</div>'
      + '<p class="phon-note">' + (d.phon.initialsNote || '') + '</p>';

    h += '<h3>' + esc(d.phon.finalsTitle) + '</h3>';
    T.finals.forEach(function (group, i) {
      h += '<div class="fin-group"><div class="fin-label">' + esc((d.phon.groupNames || [])[i] || '') + '</div>'
        + '<div class="phon-grid">' + group.map(phonCell).join('') + '</div></div>';
    });
    h += '<p class="phon-note">' + (d.phon.finalsNote || '') + '</p>';

    h += '<h3>' + esc(d.phon.tonesTitle) + '</h3><div class="phon-grid">'
      + T.tones.map(function (row, i) {
        return '<div class="phon-cell"><div class="s">' + esc(row[0]) + ' ' + esc((d.phon.toneNames || [])[i] || '')
          + '</div><div class="i">' + esc(row[1]) + '</div><div class="e">' + esc(row[2] + ' ' + row[3]) + '</div></div>';
      }).join('') + '</div>'
      + '<p class="phon-note">' + (d.phon.tonesNote || '') + '</p>';

    h += '<h3>' + esc(d.phon.diffTitle) + '</h3>';
    (d.phon.diff || []).forEach(function (block) {
      h += '<h4>' + esc(block.h) + '</h4>';
      if (block.p) h += '<p>' + block.p + '</p>';
      if (block.rows) {
        h += '<table><thead><tr>' + block.head.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('')
          + '</tr></thead><tbody>' + block.rows.map(function (r) {
            return '<tr>' + r.map(function (x) { return '<td>' + esc(x) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      }
    });

    h += '<p class="modal-link"><a href="https://github.com/SiqYin/xinganhua-fuvufa" target="_blank" rel="noopener">'
      + esc(d.phon.link) + '</a></p>';
    modalBody.innerHTML = h;
  }

  function openModal() {
    buildModal();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.getElementById('schemeBar').focus();
  }

  /* ───────── 事件 ───────── */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(input.value, true);
  });

  document.getElementById('langSwitcher').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) applyLang(b.getAttribute('data-lang'), true);
  });

  var schemeBar = document.getElementById('schemeBar');
  schemeBar.addEventListener('click', openModal);
  schemeBar.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
  });
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) {
    if (e.target.getAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  document.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () {
      input.value = b.getAttribute('data-q');
      form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    });
  });

  /* ───────── 启动 ───────── */
  var preset = new URLSearchParams(location.search).get('q');
  if (preset) input.value = preset;
  btn.disabled = true;

  loadData().then(function () {
    ready = true;
    btn.disabled = false;
    initLang();
    if (preset) doSearch(preset, false);
    else input.focus();
  }).catch(function () {
    btn.disabled = false;
    setMessage('数据载入失败。若是本地打开，请通过 HTTP 访问（例如在项目目录运行 python -m http.server），不要直接双击 HTML 文件。', true);
  });
})();
</script>
</body>
</html>
