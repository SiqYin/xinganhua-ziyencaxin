# 把静态页面、JSON 数据与字体子集发布到 GitHub Pages
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/data _site/fonts
          cp index.html _site/index.html
          cp data/xian.json data/variants.json data/i18n.json _site/data/
          cp fonts/lxgw-wenkai.woff2 fonts/OFL.txt _site/fonts/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
