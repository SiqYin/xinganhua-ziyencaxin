<svg xmlns="http://www.w3.org/2000/svg" width="648" height="365" viewBox="0 0 648 365" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans SC',sans-serif">
<rect width="648" height="365" fill="#ffffff"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">西安方言の四声（五度式音調表記）</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">縦軸は 5 が最高、1 が最低。声調番号 1/2/3/4 は音節の末尾に書きます</text><line x1="54" y1="214" x2="158" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="181.5" x2="158" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="149" x2="158" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="116.5" x2="158" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="84" x2="158" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="46" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="46" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="68" y1="181.5" x2="144" y2="214" stroke="#3f7fd0" stroke-width="4" stroke-linecap="round"/><circle cx="68" cy="181.5" r="4" fill="#3f7fd0"/><circle cx="144" cy="214" r="4" fill="#3f7fd0"/><text x="89" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">陰平 21</text><text x="89" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声調 1 · 巴 ba1</text><line x1="204" y1="214" x2="308" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="181.5" x2="308" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="149" x2="308" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="116.5" x2="308" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="84" x2="308" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="196" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="196" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="218" y1="181.5" x2="294" y2="116.5" stroke="#2fa36b" stroke-width="4" stroke-linecap="round"/><circle cx="218" cy="181.5" r="4" fill="#2fa36b"/><circle cx="294" cy="116.5" r="4" fill="#2fa36b"/><text x="239" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">陽平 24</text><text x="239" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声調 2 · 年 nian2</text><line x1="354" y1="214" x2="458" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="181.5" x2="458" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="149" x2="458" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="116.5" x2="458" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="84" x2="458" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="346" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="346" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="368" y1="84" x2="444" y2="149" stroke="#d0703f" stroke-width="4" stroke-linecap="round"/><circle cx="368" cy="84" r="4" fill="#d0703f"/><circle cx="444" cy="149" r="4" fill="#d0703f"/><text x="389" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">上声 53</text><text x="389" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声調 3 · 小 xiao3</text><line x1="504" y1="214" x2="608" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="181.5" x2="608" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="149" x2="608" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="116.5" x2="608" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="84" x2="608" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="496" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="496" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="518" y1="116.5" x2="594" y2="116.5" stroke="#9a5fc0" stroke-width="4" stroke-linecap="round"/><circle cx="518" cy="116.5" r="4" fill="#9a5fc0"/><circle cx="594" cy="116.5" r="4" fill="#9a5fc0"/><text x="539" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">去声 44</text><text x="539" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声調 4 · 去 qi4</text><text x="24" y="290" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">入声はすでにこの四声に統合され、配分は普通話と異なります：立 li1（陰平）、白 bei2（陽平）、藥 yuo1</text><text x="24" y="309" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">（陰平）、大 duo4（去声）。</text><text x="24" y="328" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">声調番号 1〜4 は普通話の ā á ǎ à と位置が対応しますが、音の高低はまったく異なります。話者は地元の調値</text><text x="24" y="347" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">で読めば十分です。</text>
</svg>
