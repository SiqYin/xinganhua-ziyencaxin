<svg xmlns="http://www.w3.org/2000/svg" width="636" height="372" viewBox="0 0 636 372" font-family="'Noto Sans','Helvetica Neue',Arial,'Noto Sans SC',sans-serif">
<rect width="636" height="372" fill="#ffffff"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Input-side short forms: the 8 abbreviations</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">In each cell: full spelling → short form; for keyboard input only — the dictionary and notation keep the full spelling</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ieng → ing</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><text x="115" y="214" font-size="11" fill="#e0973c" font-weight="normal" text-anchor="middle">new in v1.1.2</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="115" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">zero initial</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuong → yung</text><text x="311" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">zero initial</text><text x="24" y="358" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uei→ui is new in v1.1.2; the zero initials take only yuen→yun and yuong→yung.</text>
</svg>
