<svg xmlns="http://www.w3.org/2000/svg" width="636" height="372" viewBox="0 0 636 372" font-family="'Noto Sans','Helvetica Neue',Arial,'Noto Sans SC',sans-serif">
<rect width="636" height="372" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Input-side short forms: the 8 abbreviations</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">In each cell: full spelling → short form; keyboard input only — dictionary keeps full spelling</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uo → o</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → yo</text><text x="115" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">incl. zero initial</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="311" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">incl. zero initial</text><text x="24" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">The other 6 apply only after an initial consonant (wo, wei, wen, wong keep full spelling).</text>
</svg>
