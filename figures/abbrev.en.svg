<svg xmlns="http://www.w3.org/2000/svg" width="636" height="467" viewBox="0 0 636 467" font-family="'Noto Sans','Helvetica Neue',Arial,'Noto Sans SC',sans-serif">
<rect width="636" height="467" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Input-side short forms (9 in urban · 8 in southern)</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">In each cell: full spelling → short form; keyboard input only — dictionary keeps full spelling</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uo → o</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><text x="507" y="214" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">urban only · native ung in south</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → o</text><text x="115" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">after j q x</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → yo</text><text x="311" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">zero initial · after n</text><rect x="416" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="507" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">incl. zero initial</text><text x="24" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uong → ung: urban Xi’an pinyin can be simplified this way, whereas ung is already the original</text><text x="24" y="359" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">spelling in the southern suburb.</text><text x="24" y="378" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">yuo: after j q x it shortens to o (jyuo→jo, qyuo→qo, xyuo→xo; j q x never combine with uo, so</text><text x="24" y="397" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">there is no contrast); with zero initial or after n it is yo (n has both nuo and nyuo, so no is</text><text x="24" y="416" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">not used). yuen→yun includes zero initial; other shortcuts apply only after a consonant</text><text x="24" y="435" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">initial (wo, wei, wen, urban wong, southern wung stay full).</text>
</svg>
