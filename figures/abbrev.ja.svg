<svg xmlns="http://www.w3.org/2000/svg" width="636" height="448" viewBox="0 0 636 448" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans SC',sans-serif">
<rect width="636" height="448" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">入力側の略式綴り（城区音 9 種・南郊音 8 種）</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">各枠は 全拼 → 略拼。キーボード入力専用で、辞書と表記は全拼のまま</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uo → o</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><text x="507" y="214" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">城区のみ・南郊は元々 ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → o</text><text x="115" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">j q x の後</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → yo</text><text x="311" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">零声母・n の後</text><rect x="416" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="507" y="292" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">零声母も可</text><text x="24" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uong → ung：城区音のピンインはこのように簡略化できますが、南郊音は本来の綴りそのものが後者（ung）</text><text x="24" y="359" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">です。</text><text x="24" y="378" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">yuo：j q x の後は o に略します（jyuo→jo・qyuo→qo・xyuo→xo。j q x は uo と結合しないため対立しませ</text><text x="24" y="397" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">ん）。零声母と n の後は yo です（n には nuo と nyuo の対立があるため no とは略しません）。yuen→yun </text><text x="24" y="416" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">は零声母を含み、他は子音声母の後に限ります（wo・wei・wen・城区 wong・南郊 wung は全拼のまま）。</text>
</svg>
