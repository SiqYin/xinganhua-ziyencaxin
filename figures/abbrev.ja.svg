<svg xmlns="http://www.w3.org/2000/svg" width="636" height="372" viewBox="0 0 636 372" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans SC',sans-serif">
<rect width="636" height="372" fill="#ffffff"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">入力側の略式綴り：8 つのルール</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">各枠は 全拼 → 略拼。キーボード入力専用で、辞書と表記は全拼のまま</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ieng → ing</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><text x="115" y="214" font-size="11" fill="#e0973c" font-weight="normal" text-anchor="middle">v1.1.2 で追加</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="115" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">零声母</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuong → yung</text><text x="311" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">零声母</text><text x="24" y="358" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uei→ui は v1.1.2 で追加。零声母は yuen→yun、yuong→yung の 2 つのみ。</text>
</svg>
