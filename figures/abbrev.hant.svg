<svg xmlns="http://www.w3.org/2000/svg" width="636" height="372" viewBox="0 0 636 372" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans SC',sans-serif">
<rect width="636" height="372" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">西安話簡拼對照：8 條縮寫規則（輸入端專用）</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">格內：全拼 → 簡拼；只用於鍵盤輸入，詞庫與注音仍寫全拼</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uo → o</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → yo</text><text x="115" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">含零聲母</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="311" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">含零聲母</text><text x="24" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">其餘 6 條僅限前有輔音聲母時簡拼（wo、wei、wen、wong 保持全拼）。</text>
</svg>
