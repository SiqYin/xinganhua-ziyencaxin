<svg xmlns="http://www.w3.org/2000/svg" width="616" height="466" viewBox="0 0 616 466" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans SC',sans-serif">
<rect width="616" height="466" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">南郊音の変体：z c s rh が u と結合するときのそり舌変体、shu には f 変体も</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">各南郊音の下に変体も並べます（声調は同じ）。城区音が bf・pf・f・v の字および審定済みの字にのみ付与</text><text x="30" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">字</text><text x="98" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">南郊音</text><text x="248" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">変体</text><text x="466" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">城区音</text><rect x="24" y="88" width="568" height="44" fill="#f4ece6"/><text x="30" y="116" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">出</text><text x="98" y="116" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">cu1</text><rect x="240" y="96" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="116" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">chu1</text><text x="466" y="116" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">pfu1</text><text x="30" y="160" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">住</text><text x="98" y="160" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">zu4</text><rect x="240" y="140" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="160" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">zhu4</text><text x="466" y="160" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">bfu4</text><rect x="24" y="176" width="568" height="44" fill="#f4ece6"/><text x="30" y="204" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">書</text><text x="98" y="204" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">su1</text><rect x="240" y="184" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="204" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">shu1 · fu1</text><text x="466" y="204" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">fu1</text><text x="30" y="248" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">水</text><text x="98" y="248" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">suei3</text><rect x="240" y="228" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="248" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">shuei3 · fei3</text><text x="466" y="248" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">fei3</text><rect x="24" y="264" width="568" height="44" fill="#f4ece6"/><text x="30" y="292" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">入</text><text x="98" y="292" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">rhu1</text><rect x="240" y="272" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="292" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">ru1</text><text x="466" y="292" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">vu1</text><text x="30" y="336" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">中</text><text x="98" y="336" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">zuong4</text><rect x="240" y="316" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="336" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">zhuong4</text><text x="466" y="336" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">bfeng4</text><text x="24" y="374" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">南郊音の z・c・s・rh の四組の声母が u と結合するとき、zh・ch・sh・r のそり舌の変体もあります。</text><text x="24" y="393" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">また sh と u が結合する場合（shu）には f の変体もあり、例：水 suei3 → shuei3、fei3。</text><text x="24" y="412" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">変体は基本の読みと同じ声調です。字表と入力方案はいずれも両方を残し、カードでは「変体」と表示し</text><text x="24" y="431" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">ます。</text>
</svg>
