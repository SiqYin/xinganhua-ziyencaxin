<svg xmlns="http://www.w3.org/2000/svg" width="648" height="365" viewBox="0 0 648 365" font-family="'Noto Sans','Helvetica Neue',Arial,'Noto Sans SC',sans-serif">
<rect width="648" height="365" fill="#ffffff"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">The four Xi’an tones (five-level pitch scale)</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Vertical axis: 5 is highest, 1 is lowest; the tone number 1/2/3/4 follows the syllable</text><line x1="54" y1="214" x2="158" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="181.5" x2="158" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="149" x2="158" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="116.5" x2="158" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="54" y1="84" x2="158" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="46" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="46" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="68" y1="181.5" x2="144" y2="214" stroke="#3f7fd0" stroke-width="4" stroke-linecap="round"/><circle cx="68" cy="181.5" r="4" fill="#3f7fd0"/><circle cx="144" cy="214" r="4" fill="#3f7fd0"/><text x="89" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">Yinping 21</text><text x="89" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">Tone 1 · 巴 ba1</text><line x1="204" y1="214" x2="308" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="181.5" x2="308" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="149" x2="308" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="116.5" x2="308" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="204" y1="84" x2="308" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="196" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="196" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="218" y1="181.5" x2="294" y2="116.5" stroke="#2fa36b" stroke-width="4" stroke-linecap="round"/><circle cx="218" cy="181.5" r="4" fill="#2fa36b"/><circle cx="294" cy="116.5" r="4" fill="#2fa36b"/><text x="239" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">Yangping 24</text><text x="239" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">Tone 2 · 年 nian2</text><line x1="354" y1="214" x2="458" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="181.5" x2="458" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="149" x2="458" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="116.5" x2="458" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="354" y1="84" x2="458" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="346" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="346" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="368" y1="84" x2="444" y2="149" stroke="#d0703f" stroke-width="4" stroke-linecap="round"/><circle cx="368" cy="84" r="4" fill="#d0703f"/><circle cx="444" cy="149" r="4" fill="#d0703f"/><text x="389" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">Shangsheng 53</text><text x="389" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">Tone 3 · 小 xiao3</text><line x1="504" y1="214" x2="608" y2="214" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="181.5" x2="608" y2="181.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="149" x2="608" y2="149" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="116.5" x2="608" y2="116.5" stroke="#c9d4de" stroke-dasharray="2 3"/><line x1="504" y1="84" x2="608" y2="84" stroke="#c9d4de" stroke-dasharray="2 3"/><text x="496" y="88" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">5</text><text x="496" y="218" font-size="10" fill="#6b7b8c" font-weight="normal" text-anchor="end">1</text><line x1="518" y1="116.5" x2="594" y2="116.5" stroke="#9a5fc0" stroke-width="4" stroke-linecap="round"/><circle cx="518" cy="116.5" r="4" fill="#9a5fc0"/><circle cx="594" cy="116.5" r="4" fill="#9a5fc0"/><text x="539" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">Qusheng 44</text><text x="539" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">Tone 4 · 去 qi4</text><text x="24" y="290" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">The entering tone has merged into these four, with a different split from Mandarin: 立 li1</text><text x="24" y="309" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">(Yinping), 白 bei2 (Yangping), 藥 yuo1 (Yinping), 大 duo4 (Qusheng).</text><text x="24" y="328" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Tone numbers 1–4 line up with Mandarin ā á ǎ à, but the pitch contours are entirely different;</text><text x="24" y="347" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">speakers simply use the local values.</text>
</svg>
