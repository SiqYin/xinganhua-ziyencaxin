<svg xmlns="http://www.w3.org/2000/svg" width="616" height="504" viewBox="0 0 616 504" font-family="'Noto Sans','Helvetica Neue',Arial,'Noto Sans SC',sans-serif">
<rect width="616" height="504" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Southern-suburb variants: zh ch sh r before u, plus f for shu</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Variants share the base tone; added only where the urban reading has bf, pf, f or v</text><text x="30" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Char</text><text x="98" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Southern</text><text x="248" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Variant</text><text x="466" y="78" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Urban</text><rect x="24" y="88" width="568" height="44" fill="#f4ece6"/><text x="30" y="116" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">出</text><text x="98" y="116" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">cu1</text><rect x="240" y="96" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="116" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">chu1</text><text x="466" y="116" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">pfu1</text><text x="30" y="160" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">住</text><text x="98" y="160" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">zu4</text><rect x="240" y="140" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="160" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">zhu4</text><text x="466" y="160" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">bfu4</text><rect x="24" y="176" width="568" height="44" fill="#f4ece6"/><text x="30" y="204" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">書</text><text x="98" y="204" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">su1</text><rect x="240" y="184" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="204" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">shu1 · fu1</text><text x="466" y="204" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">fu1</text><text x="30" y="248" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">水</text><text x="98" y="248" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">suei3</text><rect x="240" y="228" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="248" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">shuei3 · fei3</text><text x="466" y="248" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">fei3</text><rect x="24" y="264" width="568" height="44" fill="#f4ece6"/><text x="30" y="292" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">入</text><text x="98" y="292" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">rhu1</text><rect x="240" y="272" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="292" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">ru1</text><text x="466" y="292" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">vu1</text><text x="30" y="336" font-size="19" fill="#1b2a3a" font-weight="bold" text-anchor="start">中</text><text x="98" y="336" font-size="15" fill="#2f5d8c" font-weight="normal" text-anchor="start">zuong4</text><rect x="240" y="316" width="206" height="28" rx="5" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="250" y="336" font-size="15" fill="#2f5d8c" font-weight="bold" text-anchor="start">zhuong4</text><text x="466" y="336" font-size="15" fill="#9f363a" font-weight="normal" text-anchor="start">bfeng4</text><text x="24" y="374" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Where the southern initials z, c, s and rh combine with u, the retroflex zh, ch, sh and r</text><text x="24" y="393" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">are also possible;</text><text x="24" y="412" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">and where sh combines with u (shu) there is in addition an f variant, e.g. 水 suei3 →</text><text x="24" y="431" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">shuei3, fei3.</text><text x="24" y="450" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Variants keep the tone of the base reading; both are kept in the table and the input</text><text x="24" y="469" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">scheme, and marked “variant” on the cards.</text>
</svg>
