bold" text-anchor="start">z</text><text x="134" y="314" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦ]</text><text x="134" y="329" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">字 zi4</text><rect x="272" y="276" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="298" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">c</text><text x="284" y="314" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦʰ]</text><text x="284" y="329" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">茶 ca2</text><rect x="422" y="276" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="298" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">s</text><text x="434" y="314" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[s]</text><text x="434" y="329" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">山 san1</text><rect x="572" y="276" width="140" height="58" rx="6" fill="#eef4fb" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="584" y="298" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">rh</text><text x="584" y="314" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[z]</text><text x="584" y="329" font-size="11.5"><tspan fill="#9f363a">入 vu1</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#2f5d8c">rhu1</tspan></text><text x="18" y="376" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Alveolo-palatal</text><rect x="122" y="342" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="364" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">j</text><text x="134" y="380" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨ]</text><text x="134" y="395" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">家 jia1</text><rect x="272" y="342" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="364" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">q</text><text x="284" y="380" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨʰ]</text><text x="284" y="395" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">妻 qi1</text><rect x="422" y="342" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="364" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">x</text><text x="434" y="380" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɕ]</text><text x="434" y="395" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">西 xi1</text><text x="18" y="442" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Retroflex</text><rect x="122" y="408" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="430" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">zh</text><text x="134" y="446" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂ]</text><text x="134" y="461" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">站 zan4</text><rect x="272" y="408" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="430" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ch</text><text x="284" y="446" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂʰ]</text><text x="284" y="461" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">吃 chi1</text><rect x="422" y="408" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="430" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">sh</text><text x="434" y="446" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʂ]</text><text x="434" y="461" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">上 shang4</text><rect x="572" y="408" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="584" y="430" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">r</text><text x="584" y="446" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʐ]</text><text x="584" y="461" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">人 ren2</text><text x="18" y="508" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Velar</text><rect x="122" y="474" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="496" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">g</text><text x="134" y="512" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[k]</text><text x="134" y="527" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">狗 gou3</text><rect x="272" y="474" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="496" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">k</text><text x="284" y="512" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[kʰ]</text><text x="284" y="527" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">口 kou3</text><rect x="422" y="474" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="496" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">h</text><text x="434" y="512" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[x]</text><text x="434" y="527" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">花 hua1</text><rect x="572" y="474" width="140" height="58" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="584" y="496" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ng</text><text x="584" y="512" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ŋ]</text><text x="584" y="527" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">安 ngan1</text><text x="18" y="574" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Zero initial</text><rect x="122" y="540" width="140" height="58" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="134" y="562" font-size="12" fill="#1b2a3a" font-weight="bold" text-anchor="start">(none)</text><text x="134" y="578" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="134" y="593" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">衣 yi1 / 阿 a1</text><text x="18" y="646" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s take only ɿ and broad finals; narrow (i / y) finals always take j q x. bf pf occur only before u-medial or broad</text><text x="18" y="665" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">finals; r takes 7 broad finals; ng takes broad finals only.</text><text x="18" y="684" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">日 而 兒 耳 二 are not read r-; they take the zero initial er.</text><text x="18" y="703" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf and pf are urban-only: the southern suburb reads z and c with a u medial (中 zuong4, 窗 cuang1).</text><text x="18" y="722" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">rh (z) is southern-only: the urban reading has v (入 vu1→rhu1, 軟 van3→rhuan3, 潤 ven4→rhuen4); the other initials</text><text x="18" y="741" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">are the same in both.</text>
</svg>
