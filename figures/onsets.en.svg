<text x="18" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Xi’an initials: urban 26 · southern 25</text><text x="18" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Incl. the zero initial. spelling · IPA · example; red = urban, blue = southern</text><rect x="508" y="20" width="14" height="14" fill="#f2f7ff" stroke="#8fb6e4"/><text x="528" y="32" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Same letter and sound as Mandarin</text><rect x="508" y="42" width="14" height="14" fill="#fff1e0" stroke="#e0973c"/><text x="528" y="54" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Not found in Mandarin</text><rect x="508" y="64" width="14" height="14" fill="#eef4fb" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="528" y="76" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Southern suburb only</text><text x="18" y="112" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Bilabial</text><rect x="122" y="78" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">b</text><text x="134" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[p]</text><text x="134" y="131" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">巴 ba1</text><rect x="272" y="78" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">p</text><text x="284" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pʰ]</text><text x="284" y="131" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">朋 peng2</text><rect x="422" y="78" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">m</text><text x="434" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[m]</text><text x="434" y="131" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">明 mieng2</text><text x="18" y="178" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Labiodental</text><rect x="122" y="144" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="166" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">f</text><text x="134" y="182" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[f]</text><text x="134" y="197" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">夫 fu1</text><rect x="272" y="144" width="140" height="58" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="284" y="166" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">v</text><text x="284" y="182" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[v]</text><text x="284" y="197" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">文 ven2</text><rect x="422" y="144" width="140" height="58" rx="6" fill="#faf1ee" stroke="#9f363a" stroke-dasharray="4 3"/><text x="434" y="166" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">bf</text><text x="434" y="182" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pf]</text><text x="434" y="197" font-size="11.5"><tspan fill="#9f363a">中 bfeng4</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#2f5d8c">zuong4</tspan></text><rect x="572" y="144" width="140" height="58" rx="6" fill="#faf1ee" stroke="#9f363a" stroke-dasharray="4 3"/><text x="584" y="166" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">pf</text><text x="584" y="182" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pfʰ]</text><text x="584" y="197" font-size="11.5"><tspan fill="#9f363a">窗 pfang1</tspan><tspan fill="#8a