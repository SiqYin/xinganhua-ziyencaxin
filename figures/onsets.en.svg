<text x="18" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Xi’an initials: urban 26 · southern 25</text><text x="18" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Incl. the zero initial. spelling · IPA · example; red = urban, purple = southern</text><rect x="508" y="20" width="14" height="14" fill="#f2f7ff" stroke="#8fb6e4"/><text x="528" y="32" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Same letter and sound as Mandarin</text><rect x="508" y="42" width="14" height="14" fill="#fff1e0" stroke="#e0973c"/><text x="528" y="54" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Not found in Mandarin</text><rect x="508" y="64" width="14" height="14" fill="#fff1e0" stroke="#9f363a" stroke-dasharray="4 3"/><text x="528" y="76" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Urban-only (red dashed)</text><rect x="508" y="86" width="14" height="14" fill="#fff1e0" stroke="#7b5fc0" stroke-dasharray="4 3"/><text x="528" y="98" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Southern-only (purple dashed)</text><text x="18" y="138" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Bilabial</text><rect x="122" y="104" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="126" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">b</text><text x="134" y="142" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[p]</text><text x="134" y="157" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">巴 ba1</text><rect x="272" y="104" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="126" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">p</text><text x="284" y="142" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pʰ]</text><text x="284" y="157" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">朋 peng2</text><rect x="422" y="104" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="126" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">m</text><text x="434" y="142" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[m]</text><text x="434" y="157" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">明 mieng2</text><text x="18" y="204" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Labiodental</text><rect x="122" y="170" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">f</text><text x="134" y="208" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[f]</text><text x="134" y="223" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">夫 fu1</text><rect x="272" y="170" width="140" height="58" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="284" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">v</text><text x="284" y="208" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[v]</text><text x="284" y="223" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">文 ven2</text><rect x="422" y="170" width="140" height="58" rx="6" fill="#fff1e0" stroke="#9f363a" stroke-dasharray="4 3"/><text x="434" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">bf</text><text x="434" y="208" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pf]</text><text x="434" y="223" font-size="11.5"><tspan fill="#9f363a">中 bfeng4</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#7b5fc0">zuong4</tspan></text><rect x="572" y="170" width="140" height="58" rx="6" fill="#fff1e0" stroke="#9f363a" stroke-dasharray="4 3"/><text x="584" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">pf</text><text x="584" y="208" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pfʰ]</text><text x="584" y="223" font-size="11.5"><tspan fill="#9f363a">窗 pfang1</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#7b5fc0">cuang1</tspan></text><text x="18" y="270" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Alveolar</text><rect x="122" y="236" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="258" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">d</text><text x="134" y="274" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[t]</text><text x="134" y="289" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">的 di1</text><rect x="272" y="236" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="258" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">t</text><text x="284" y="274" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʰ]</text><text x="284" y="289" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">他 ta1</text><rect x="422" y="236" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="258" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">n</text><text x="434" y="274" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[n]</text><text x="434" y="289" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">你 ni3</text><rect x="572" y="236" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="584" y="258" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">l</text><text x="584" y="274" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[l]</text><text x="584" y="289" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">立 li1</text><text x="18" y="336" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Dental</text><rect x="122" y="302" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="324" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">z</text><text x="134" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦ]</text><text x="134" y="355" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">字 zi4</text><rect x="272" y="302" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="324" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">c</text><text x="284" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦʰ]</text><text x="284" y="355" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">茶 ca2</text><rect x="422" y="302" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="324" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">s</text><text x="434" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[s]</text><text x="434" y="355" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">山 san1</text><rect x="572" y="302" width="140" height="58" rx="6" fill="#fff1e0" stroke="#7b5fc0" stroke-dasharray="4 3"/><text x="584" y="324" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">rh</text><text x="584" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[z]</text><text x="584" y="355" font-size="11.5"><tspan fill="#9f363a">入 vu1</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#7b5fc0">rhu1</tspan></text><text x="18" y="402" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Alveolo-palatal</text><rect x="122" y="368" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="390" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">j</text><text x="134" y="406" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨ]</text><text x="134" y="421" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">家 jia1</text><rect x="272" y="368" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="390" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">q</text><text x="284" y="406" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨʰ]</text><text x="284" y="421" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">妻 qi1</text><rect x="422" y="368" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="390" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">x</text><text x="434" y="406" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɕ]</text><text x="434" y="421" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">西 xi1</text><text x="18" y="468" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Retroflex</text><rect x="122" y="434" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="456" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">zh</text><text x="134" y="472" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂ]</text><text x="134" y="487" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">站 zan4</text><rect x="272" y="434" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="456" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ch</text><text x="284" y="472" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂʰ]</text><text x="284" y="487" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">吃 chi1</text><rect x="422" y="434" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="456" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">sh</text><text x="434" y="472" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʂ]</text><text x="434" y="487" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">上 shang4</text><rect x="572" y="434" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="584" y="456" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">r</text><text x="584" y="472" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʐ]</text><text x="584" y="487" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">人 ren2</text><text x="18" y="534" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Velar</text><rect x="122" y="500" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="522" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">g</text><text x="134" y="538" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[k]</text><text x="134" y="553" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">狗 gou3</text><rect x="272" y="500" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="522" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">k</text><text x="284" y="538" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[kʰ]</text><text x="284" y="553" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">口 kou3</text><rect x="422" y="500" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="522" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">h</text><text x="434" y="538" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[x]</text><text x="434" y="553" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">花 hua1</text><rect x="572" y="500" width="140" height="58" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="584" y="522" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ng</text><text x="584" y="538" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ŋ]</text><text x="584" y="553" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">安 ngan1</text><text x="18" y="600" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Zero initial</text><rect x="122" y="566" width="140" height="58" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="588" font-size="12" fill="#1b2a3a" font-weight="bold" text-anchor="start">(none)</text><text x="134" y="604" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="134" y="619" font-size="11.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">衣 yi1 / 阿 a1</text><text x="18" y="672" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s take only ɿ and broad finals; narrow (i / y) finals always take j q x. bf pf occur only before u-medial or broad</text><text x="18" y="691" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">finals; r takes 7 broad finals; ng takes broad finals only.</text><text x="18" y="710" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">日 而 兒 耳 二 are not read r-; they take the zero initial er.</text><text x="18" y="729" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf and pf are urban-only: the southern suburb reads z and c with a u medial (中 zuong4, 窗 cuang1).</text><text x="18" y="748" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">rh (z) is southern-only: the urban reading has v (入 vu1→rhu1, 軟 van3→rhuan3, 潤 ven4→rhuen4); the other initials</text><text x="18" y="767" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">are the same in both.</text>
