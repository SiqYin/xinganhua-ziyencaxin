ll="#1b2a3a" font-weight="bold" text-anchor="start">j</text><text x="123" y="367" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tɕ]</text><text x="123" y="386" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">家 jia1</text><rect x="218" y="332" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="227" y="352" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">q</text><text x="227" y="367" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tɕʰ]</text><text x="227" y="386" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">妻 qi1</text><rect x="322" y="332" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="331" y="352" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">x</text><text x="331" y="367" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɕ]</text><text x="331" y="386" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">西 xi1</text><text x="18" y="449" font-size="11.5" fill="#6b7b8c" font-weight="bold" text-anchor="start">Retroflex</text><rect x="114" y="410" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="123" y="430" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">zh</text><text x="123" y="445" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʈʂ]</text><text x="123" y="464" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">張 zhang1</text><rect x="218" y="410" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="227" y="430" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">ch</text><text x="227" y="445" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʈʂʰ]</text><text x="227" y="464" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">吃 chi1</text><rect x="322" y="410" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="331" y="430" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">sh</text><text x="331" y="445" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʂ]</text><text x="331" y="464" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">上 shang4</text><rect x="426" y="410" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="435" y="430" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">r</text><text x="435" y="445" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɻ]</text><text x="435" y="464" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">人 ren2</text><text x="18" y="527" font-size="11.5" fill="#6b7b8c" font-weight="bold" text-anchor="start">Dental</text><rect x="114" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="123" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">z</text><text x="123" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ts]</text><text x="123" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">字 zi4</text><rect x="218" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="227" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">c</text><text x="227" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tsʰ]</text><text x="227" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">茶 ca2</text><rect x="322" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="331" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">s</text><text x="331" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[s]</text><text x="331" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">山 san1</text><rect x="426" y="488" width="96" height="68" rx="6" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="435" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">rh</text><text x="435" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[z]</text><text x="435" y="537" font-size="11" fill="#9f363a" font-weight="normal" text-anchor="start">入 vu1</text><text x="435" y="551" font-size="11" fill="#2f5d8c" font-weight="normal" text-anchor="start">rhu1</text><text x="18" y="605" font-size="11.5" fill="#6b7b8c" font-weight="bold" text-anchor="start">Zero initial</text><rect x="114" y="566" width="145.6" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="123" y="586" font-size="11.5" fill="#1b2a3a" font-weight="bold" text-anchor="start">(none)</text><text x="123" y="601" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="123" y="620" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">衣 yi1 / 阿 a1</text><text x="18" y="668" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">¹ Initial n is realised as [ȵ] before narrow finals starting with i or y (e.g. 南 nan2 [n], 你 ni3 / 女 nyu3 [ȵ]).</text><text x="18" y="687" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s take only ɿ and broad finals; narrow (i / y) finals always take j q x. r takes 7 broad finals (日 而 兒 耳 二 take zero initial er); ng</text><text x="18" y="706" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">takes broad finals only.</text><text x="18" y="725" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf and pf are urban-only: southern Xi’an reads z and c with a u medial (中 bfeng4/zung4, 窗 pfang1/cuang1).</text><text x="18" y="744" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">rh ([z]) is southern-only: the urban reading has v (入 vu1→rhu1, 若 vuo1→rhuo1, 軟 van3→rhuan3, 潤 ven4→rhuen4).</text>
