<text x="18" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">Xi’an initials: urban 26 · southern 24</text><text x="18" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">Incl. the zero initial. spelling · IPA · example; red = urban, blue = southern</text><rect x="508" y="20" width="14" height="14" fill="#f2f7ff" stroke="#8fb6e4"/><text x="528" y="32" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Same letter and sound as Mandarin</text><rect x="508" y="42" width="14" height="14" fill="#fff1e0" stroke="#e0973c"/><text x="528" y="54" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">Not found in Mandarin</text><text x="18" y="112" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Bilabial</text><rect x="122" y="78" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">b</text><text x="134" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[p]</text><text x="134" y="130.58" font-size="11" fill="#1b2a3a">巴 ba1</text><rect x="272" y="78" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">p</text><text x="284" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pʰ]</text><text x="284" y="130.58" font-size="11" fill="#1b2a3a">朋 peng2</text><rect x="422" y="78" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="100" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">m</text><text x="434" y="116" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[m]</text><text x="434" y="130.58" font-size="11" fill="#1b2a3a">明 mieng2</text><text x="18" y="192" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Labiodental</text><rect x="122" y="158" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="180" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">f</text><text x="134" y="196" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[f]</text><text x="134" y="210.58" font-size="11" fill="#1b2a3a">夫 fu1</text><rect x="272" y="158" width="140" height="72" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="284" y="180" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">v</text><text x="284" y="196" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[v]</text><text x="284" y="210.58" font-size="11" fill="#1b2a3a">文 ven2</text><rect x="422" y="158" width="140" height="72" rx="6" fill="#faf1ee" stroke="#9f363a" stroke-dasharray="4 3"/><text x="434" y="180" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">bf</text><text x="434" y="196" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pf]</text><text x="434" y="210.58" font-size="11" fill="#9f363a">中 bfeng4</text><text x="434" y="222.58" font-size="11" fill="#2f5d8c">zuong4</text><rect x="572" y="158" width="140" height="72" rx="6" fill="#faf1ee" stroke="#9f363a" stroke-dasharray="4 3"/><text x="584" y="180" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">pf</text><text x="584" y="196" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[pfʰ]</text><text x="584" y="210.58" font-size="11" fill="#9f363a">窗 pfang1</text><text x="584" y="222.58" font-size="11" fill="#2f5d8c">cuang1</text><text x="18" y="272" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Alveolar</text><rect x="122" y="238" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="260" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">d</text><text x="134" y="276" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[t]</text><text x="134" y="290.58" font-size="11" fill="#1b2a3a">的 di1</text><rect x="272" y="238" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="260" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">t</text><text x="284" y="276" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʰ]</text><text x="284" y="290.58" font-size="11" fill="#1b2a3a">他 ta1</text><rect x="422" y="238" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="260" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">n</text><text x="434" y="276" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[n]</text><text x="434" y="290.58" font-size="11" fill="#1b2a3a">你 ni3</text><rect x="572" y="238" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="584" y="260" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">l</text><text x="584" y="276" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[l]</text><text x="584" y="290.58" font-size="11" fill="#1b2a3a">立 li1</text><text x="18" y="352" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Dental</text><rect x="122" y="318" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="340" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">z</text><text x="134" y="356" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦ]</text><text x="134" y="370.58" font-size="11" fill="#1b2a3a">字 zi4</text><rect x="272" y="318" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="340" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">c</text><text x="284" y="356" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʦʰ]</text><text x="284" y="370.58" font-size="11" fill="#1b2a3a">茶 ca2</text><rect x="422" y="318" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="340" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">s</text><text x="434" y="356" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[s]</text><text x="434" y="370.58" font-size="11" fill="#1b2a3a">山 san1</text><text x="18" y="432" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Alveolo-palatal</text><rect x="122" y="398" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="420" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">j</text><text x="134" y="436" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨ]</text><text x="134" y="450.58" font-size="11" fill="#1b2a3a">家 jia1</text><rect x="272" y="398" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="420" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">q</text><text x="284" y="436" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʨʰ]</text><text x="284" y="450.58" font-size="11" fill="#1b2a3a">妻 qi1</text><rect x="422" y="398" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="420" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">x</text><text x="434" y="436" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɕ]</text><text x="434" y="450.58" font-size="11" fill="#1b2a3a">西 xi1</text><text x="18" y="512" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Retroflex</text><rect x="122" y="478" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="500" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">zh</text><text x="134" y="516" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂ]</text><text x="134" y="530.58" font-size="11" fill="#1b2a3a">站 zan4</text><rect x="272" y="478" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="500" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ch</text><text x="284" y="516" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tʂʰ]</text><text x="284" y="530.58" font-size="11" fill="#1b2a3a">吃 chi1</text><rect x="422" y="478" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="500" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">sh</text><text x="434" y="516" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʂ]</text><text x="434" y="530.58" font-size="11" fill="#1b2a3a">上 shang4</text><rect x="572" y="478" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="584" y="500" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">r</text><text x="584" y="516" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ʐ]</text><text x="584" y="530.58" font-size="11" fill="#1b2a3a">人 ren2</text><text x="18" y="592" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Velar</text><rect x="122" y="558" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="134" y="580" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">g</text><text x="134" y="596" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[k]</text><text x="134" y="610.58" font-size="11" fill="#1b2a3a">狗 gou3</text><rect x="272" y="558" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="284" y="580" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">k</text><text x="284" y="596" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[kʰ]</text><text x="284" y="610.58" font-size="11" fill="#1b2a3a">口 kou3</text><rect x="422" y="558" width="140" height="72" rx="6" fill="#f2f7ff" stroke="#8fb6e4"/><text x="434" y="580" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">h</text><text x="434" y="596" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[x]</text><text x="434" y="610.58" font-size="11" fill="#1b2a3a">花 hua1</text><rect x="572" y="558" width="140" height="72" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="584" y="580" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">ng</text><text x="584" y="596" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ŋ]</text><text x="584" y="610.58" font-size="11" fill="#1b2a3a">安 ngan1</text><text x="18" y="672" font-size="12" fill="#6b7b8c" font-weight="bold" text-anchor="start">Zero initial</text><rect x="122" y="638" width="140" height="72" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="134" y="660" font-size="12" fill="#1b2a3a" font-weight="bold" text-anchor="start">(none)</text><text x="134" y="676" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="134" y="690.58" font-size="11" fill="#1b2a3a">衣 yi1 / 阿 a1</text><text x="18" y="758" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s take only ɿ and broad finals; narrow (i / y) finals always take j q x. bf pf occur only before u-medial or broad</text><text x="18" y="777" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">finals; r takes 7 broad finals; ng takes broad finals only.</text><text x="18" y="796" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">日 而 兒 耳 二 are not read r-; they take the zero initial er.</text><text x="18" y="815" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf and pf are urban-only: the southern suburb reads z and c with a u medial (中 zuong4, 窗 cuang1); the other</text><text x="18" y="834" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">initials are the same in both.</text>
</svg>
