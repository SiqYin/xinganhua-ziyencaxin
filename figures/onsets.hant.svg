ize="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[z]</text><text x="401" y="537" font-size="11" fill="#9f363a" font-weight="normal" text-anchor="start">入 vu1</text><text x="401" y="551" font-size="11" fill="#2f5d8c" font-weight="normal" text-anchor="start">rhu1</text><text x="18" y="605" font-size="13" fill="#6b7b8c" font-weight="bold" text-anchor="start">零聲母</text><rect x="80" y="566" width="145.6" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="89" y="586" font-size="11.5" fill="#1b2a3a" font-weight="bold" text-anchor="start">（不標）</text><text x="89" y="601" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="89" y="620" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">衣 yi1 / 阿 a1</text><text x="18" y="668" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">¹ 音節內 n 與 i、y 起頭的細音韻母相拼時音值爲 [ȵ]（如 南 nan2 爲 [n]，你 ni3、女 nyu3 爲 [ȵ]）。</text><text x="18" y="687" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s 只接 ɿ 和洪音韻母，細音一律 j q x；r 只配 7 個洪音韻母（日 而 兒 耳 二 讀零聲母 er）；ng 只配洪音。</text><text x="18" y="706" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf、pf 爲城區音特有：南郊音讀 z、c，韻母同時增生 u 介音（中 bfeng4/zung4、窗 pfang1/cuang1）。</text><text x="18" y="725" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">rh（[z]）爲南郊音特有：城區音讀 v（入 vu1→rhu1、若 vuo1→rhuo1、軟 van3→rhuan3、潤 ven4→rhuen4）。</text>
