<svg xmlns="http://www.w3.org/2000/svg" width="908" height="522" viewBox="0 0 908 522" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans SC',sans-serif">
<rect width="908" height="522" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">音節の構造：声母＋韻母＋声調番号（城区音・南郊音とも同じ構造）</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">韻母は介音を含む。零声母は字母を書かず、斉呼は y、合呼は w、撮呼は yu- のまま</text><rect x="24" y="70" width="84" height="22" rx="4" fill="#eef2f6" stroke="#d8cec6"/><text x="66" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声母</text><rect x="116" y="70" width="124" height="22" rx="4" fill="#eef2f6" stroke="#d8cec6"/><text x="178" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">韻母</text><rect x="248" y="70" width="58" height="22" rx="4" fill="#eef2f6" stroke="#d8cec6"/><text x="277" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声調番号</text><rect x="314" y="70" width="208" height="22" rx="4" fill="#eef2f6" stroke="#d8cec6"/><text x="418" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">例字</text><rect x="24" y="96" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="121" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">b</text><rect x="116" y="96" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="121" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">a</text><rect x="248" y="96" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="121" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="121" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">巴</text><rect x="24" y="144" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="169" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">t</text><rect x="116" y="144" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="169" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">ian</text><rect x="248" y="144" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="169" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="169" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">天</text><rect x="24" y="192" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="217" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">bf</text><rect x="116" y="192" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="217" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">eng</text><rect x="248" y="192" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="217" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">4</text><text x="318" y="217" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">中（城区音）</text><rect x="24" y="240" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="265" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">z</text><rect x="116" y="240" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="265" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">ung</text><rect x="248" y="240" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="265" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">4</text><text x="318" y="265" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">中（南郊音）</text><rect x="24" y="288" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="313" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">rh</text><rect x="116" y="288" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="313" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">u</text><rect x="248" y="288" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="313" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="313" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">入（南郊音）</text><rect x="24" y="336" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="361" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">j</text><rect x="116" y="336" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="361" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">yuen</text><rect x="248" y="336" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="361" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="361" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">軍</text><rect x="24" y="384" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="409" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">—</text><rect x="116" y="384" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="409" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">a</text><rect x="248" y="384" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="409" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="409" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">阿（零声母）</text><rect x="24" y="432" width="84" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="66" y="457" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">—</text><rect x="116" y="432" width="124" height="38" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="178" y="457" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">you</text><rect x="248" y="432" width="58" height="38" rx="6" fill="#fff4f0" stroke="#d8cec6"/><text x="277" y="457" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">3</text><text x="318" y="457" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">有（零声母 iɤu → you）</text><rect x="554" y="90" width="330" height="322" rx="8" fill="#fffbe6" stroke="#d0b45a"/><text x="568" y="116" font-size="13.5" fill="#1b2a3a" font-weight="bold" text-anchor="start">音節の境界：撇号（アポストロフィ）</text><text x="572" y="140" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">2 音節を続けて書くと切り分けを誤るときに ' を置き</text><text x="572" y="159" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">ます。普通話の xi'an と同じ理屈です。</text><text x="572" y="178" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">最も典型的な例が「西安」そのもの：</text><text x="572" y="197" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start"></text><text x="572" y="216" font-size="12" fill="#1b2a3a" font-weight="bold" text-anchor="start">    西 xi1 + 安 ngan1  →  xi'ngan1</text><text x="572" y="235" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start"></text><text x="572" y="254" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">xingan と続けて書くと xin（心の簡拼）＋ gan（干</text><text x="572" y="273" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">）に切り直されてしまうため、</text><text x="572" y="292" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">撇号が必要です。リポジトリ名 xinganhua-fuvufa </text><text x="572" y="311" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">はこの理由で撇号を外しています。</text><text x="572" y="330" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">入力側の略式綴り：ien→in、iou→iu、uo→o、uei→ui</text><text x="572" y="349" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">、uen→un、yuen→yun。j q x の後の yuo は o（jyuo→</text><text x="572" y="368" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">jo）、零声母と n の後は yo。城区音 uong は ung と</text><text x="572" y="387" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">略せますが、南郊音は元々 ung です。</text>
</svg>
