<svg xmlns="http://www.w3.org/2000/svg" width="636" height="410" viewBox="0 0 636 410" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
<rect width="636" height="410" fill="#FBF7F4"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">西安话简拼对照：输入端缩写规则（城区 8 条 · 南郊 7 条）</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">格内：全拼 → 简拼；只用于键盘输入，词库与注音仍写全拼</text><rect x="24" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">ien → in</text><rect x="220" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">iou → iu</text><rect x="416" y="84" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="114" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uo → o</text><rect x="24" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uei → ui</text><rect x="220" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uen → un</text><rect x="416" y="162" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="507" y="192" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">uong → ung</text><text x="507" y="214" font-size="10.5" fill="#6b7b8c" font-weight="normal" text-anchor="middle">城区简拼 · 南郊本即 ung</text><rect x="24" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="115" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuo → yo</text><text x="115" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">含零声母</text><rect x="220" y="240" width="182" height="66" rx="6" fill="#f7fafc" stroke="#d8cec6"/><text x="311" y="270" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="middle">yuen → yun</text><text x="311" y="292" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="middle">含零声母</text><text x="24" y="340" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uong → ung：城区音中拼音可以这样简化，南郊音本来的拼写就是后者（ung）。</text><text x="24" y="359" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">除 yuo→yo、yuen→yun 含零声母外，其余仅限前有辅音声母时简拼（wo、wei、wen、城区 wong 与南郊 wung </text><text x="24" y="378" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">保持全拼）。</text>
</svg>
