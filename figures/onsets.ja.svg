" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">上 shang4</text><rect x="396" y="410" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="405" y="430" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">r</text><text x="405" y="445" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ɻ]</text><text x="405" y="464" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">人 ren2</text><text x="18" y="527" font-size="13" fill="#6b7b8c" font-weight="bold" text-anchor="start">舌尖前</text><rect x="84" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="93" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">z</text><text x="93" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ts]</text><text x="93" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">字 zi4</text><rect x="188" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="197" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">c</text><text x="197" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[tsʰ]</text><text x="197" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">茶 ca2</text><rect x="292" y="488" width="96" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="301" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">s</text><text x="301" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[s]</text><text x="301" y="542" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">山 san1</text><rect x="396" y="488" width="96" height="68" rx="6" fill="#e6eef6" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="405" y="508" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="start">rh</text><text x="405" y="523" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[z]</text><text x="405" y="537" font-size="11" fill="#9f363a" font-weight="normal" text-anchor="start">入 vu1</text><text x="405" y="551" font-size="11" fill="#2f5d8c" font-weight="normal" text-anchor="start">rhu1</text><text x="18" y="605" font-size="13" fill="#6b7b8c" font-weight="bold" text-anchor="start">零声母</text><rect x="84" y="566" width="145.6" height="68" rx="6" fill="#f1ece7" stroke="#bfb2a6"/><text x="93" y="586" font-size="11.5" fill="#1b2a3a" font-weight="bold" text-anchor="start">（表記なし）</text><text x="93" y="601" font-size="11.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">[Ø]</text><text x="93" y="620" font-size="11" fill="#1b2a3a" font-weight="normal" text-anchor="start">衣 yi1 / 阿 a1</text><text x="18" y="668" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">¹ n は i・y で始まる細音の韻母と結合するとき [ȵ] となります（南 nan2 は [n]、你 ni3・女 nyu3 は [ȵ]）。</text><text x="18" y="687" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">z c s は ɿ と洪音のみ、細音は必ず j q x。r は洪音 7 種のみ（日 而 兒 耳 二 は零声母 er）、ng も洪音のみ。</text><text x="18" y="706" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">bf・pf は城区音特有です。南郊音では z・c となり、韻母に u 介音が加わります（中 bfeng4/zung4、窗 pfang1/cuang1）。</text><text x="18" y="725" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">rh（[z]）は南郊音特有です。城区音では v で読みます（入 vu1→rhu1、若 vuo1→rhuo1、軟 van3→rhuan3、潤 ven4→rhuen4）。</text>
