text><text x="553" y="349" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[iã]</text><text x="553" y="363" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">煙 yan1</text><rect x="636" y="315" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="645" y="334" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">ien</text><text x="645" y="349" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[iẽ]</text><text x="645" y="363" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">音 yen1</text><rect x="84" y="379" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="93" y="398" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">ieng</text><text x="93" y="413" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[iɣ̃]</text><text x="93" y="427" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">英 yeng1</text><rect x="176" y="379" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="185" y="398" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">iou</text><text x="185" y="413" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[iɤu]</text><text x="185" y="427" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">有 you1</text><rect x="268" y="379" width="84" height="54" rx="6" fill="#eaf7ea" stroke="#7fbf7f"/><text x="277" y="398" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">iang</text><text x="277" y="413" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[iɑɣ̃]</text><text x="277" y="427" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">央 yang1</text><text x="18" y="473" font-size="11.5" fill="#6b7b8c" font-weight="bold" text-anchor="start">u-medial 9</text><rect x="84" y="443" width="84" height="54" rx="6" fill="#f2f7ff" stroke="#8fb