itial (jyuen 軍, qyuo 卻, nyu 女).</text><text x="18" y="694" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">The urban uu and iai are e and ie in the southern suburb (胳 guu1→ge1, 皆 jiai1→jie1); the southern yua (髽 zyua4) is</text><text x="18" y="713" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">southern-only; the other finals are the same in both.</text>
