" y="462" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">uei</text><text x="553" y="477" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[uei]</text><text x="553" y="491" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">回 huei2</text><rect x="636" y="443" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="645" y="462" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">uen</text><text x="645" y="477" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[uẽ]</text><text x="645" y="491" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">溫 wen1</text><rect x="84" y="507" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="93" y="526" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">uong</text><text x="93" y="541" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[uoɣ̃]</text><text x="93" y="555" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">翁 wong1</text><rect x="176" y="507" width="84" height="54" rx="6" fill="#eaf7ea" stroke="#7fbf7f"/><text x="185" y="526" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">uang</text><text x="185" y="541" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[uɑɣ̃]</text><text x="185" y="555" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">汪 wang1</text><text x="18" y="601" font-size="11.5" fill="#6b7b8c" font-weight="bold" text-anchor="start">ü-medial 6</text><rect x="84" y="571" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="93" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yu</text><text x="93" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[y]</text><text x="93" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">魚 yu2</text><rect x="176" y="571" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="185" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yue</text><text x="185" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yɛ]</text><text x="185" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">月 yue1</text><rect x="268" y="571" width="84" height="54" rx="6" fill="#fff1e0" stroke="#e0973c"/><text x="277" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yuo</text><text x="277" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yɤ]</text><text x="277" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">樂 yuo1</text><rect x="360" y="571" width="84" height="54" rx="6" fill="#eef4fb" stroke="#2f5d8c" stroke-dasharray="4 3"/><text x="369" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yua</text><text x="369" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[ya]</text><text x="369" y="619" font-size="10.5" fill="#2f5d8c">髽 zyua4</text><rect x="452" y="571" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="461" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yuan</text><text x="461" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yã]</text><text x="461" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">元 yuan2</text><rect x="544" y="571" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="553" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yuen</text><text x="553" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yẽ]</text><text x="553" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">勻 yuen2</text><rect x="636" y="571" width="84" height="54" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="645" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yuong</text><text x="645" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yoɣ̃]</text><text x="645" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">容 yuong2</text><text x="18" y="675" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">The nasal finals an en ang eng (and their variants in the other classes) are nasalised vowels, with no -n / -ng coda</text><text x="18" y="694" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">as in Mandarin.</text><text x="18" y="713" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uong / yuong match Mandarin ong / iong; the ü-series always keeps y, even after an initial (jyuen 軍, nyu 女).</text><text x="18" y="732" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">The urban uu and iai are e and ie in the southern suburb (胳 guu1→ge1, 皆 jiai1→jie1); the southern yua (髽 zyua4) is</text><text x="18" y="751" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">southern-only; the other finals are the same in both.</text>
</svg>
