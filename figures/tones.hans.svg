16.5" stroke="#9a5fc0" stroke-width="4" stroke-linecap="round"/><circle cx="518" cy="116.5" r="4" fill="#9a5fc0"/><circle cx="594" cy="116.5" r="4" fill="#9a5fc0"/><text x="539" y="240" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">去声 44</text><text x="539" y="260" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">调号 4 · 去 qi4</text><text x="24" y="290" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">入声已归并到这四调，归派与普通话不同：立 li1（阴平）、白 bei2（阳平）、藥 yuo1（阴平）、大 duo4（去</text><text x="24" y="309" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">声）。</text><text x="24" y="328" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">四个调号数字分别对应的是阴平、阳平、上声、去声。母语者按本地调式念即可。</text><rect x="24" y="339" width="600" height="128" rx="8" fill="#fffbe6" stroke="#dcc05a"/><text x="38" y="361" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">连读变调：变调落在前字</text><text x="38" y="383" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">西安话的连读变调主要是前字变调，分为两类：</text><text x="240" y="401" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="end">阴平 + 阴平</text><text x="318" y="401" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="start">21-21</text><text x="364.4" y="401" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="start">→</text><text x="414" y="401" font-size="13" fill="#dcc05a" font-weight="bold" text-anchor="start">24-21</text><text x="466.4" y="401" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">前一字改读阳平</text><text x="240" y="431" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="end">上声 + 上声</text><text x="318" y="431" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="start">53-53</text><text x="364.4" y="431" font-size="13" fill="#6b7b8c" font-weight="normal" text-anchor="start">→</text><text x="414" y="431" font-size="13" fill="#dcc05a" font-weight="bold" text-anchor="start">21-53</text><text x="466.4" y="431" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">前一字改读阴平</text>
</svg>
